<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>brain.aolabs.io</title>
  <meta name="description" content="Brain PDF bank with Voice, Follow-through, and Insight scores." />
  <link rel="canonical" href="https://aolabs.io/brain/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AO Labs">
  <meta property="og:title" content="brain">
  <meta property="og:description" content="Saved notes with highlighted evidence and scores over time.">
  <meta property="og:url" content="https://aolabs.io/brain/">
  <meta property="og:image" content="https://aolabs.io/brain/scores-preview.png">
  <meta property="og:image:secure_url" content="https://aolabs.io/brain/scores-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="brain preview card.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="brain">
  <meta name="twitter:description" content="Saved notes with highlighted evidence and scores over time.">
  <meta name="twitter:image" content="https://aolabs.io/brain/scores-preview.png">
  <meta name="twitter:image:alt" content="brain preview card.">
<link rel="icon" href="./favicon.svg?v=20260612-hub-mark" type="image/svg+xml">
  <link rel="stylesheet" href="https://aolabs.io/suite-header.css?v=20260516-suite-bloom">
  <link rel="stylesheet" href="./styles.css?v=20261021-evidence-v13">
  <script src="./config.js?v=20261021-evidence-v13"></script>
  <script src="./app.js?v=20261021-evidence-v13" defer></script>
  <link rel="stylesheet" href="./scores.css?v=20261021-evidence-v13">
  <script src="./scores.js?v=20261021-evidence-v13" defer></script>
</head>
<body>
  <header class="suite-topbar" aria-label="brain navigation">
    <div class="suite-brand-cluster">
      <a class="suite-ao-home" href="https://aolabs.io/" aria-label="aolabs.io">
        <img src="https://aolabs.io/marks/ao-ink.svg?v=20260516-suite-bloom" alt="">
      </a>
      <a class="suite-app-brand" href="./" aria-label="brain home">
        <img class="suite-app-mark" src="./favicon.svg?v=20260612-hub-mark" alt="">
        <span class="suite-app-name">brain.aolabs.io</span>
      </a>
    </div>
  </header>

  <main class="shell document-shell">
    <section class="document-intro" aria-label="document summary">
      <p>Brain PDF bank for documents, text, files, images, and goal-relevant thoughts.</p>
      <div id="score-voice" class="overall-score" aria-live="polite">
        <span>voice</span>
        <strong>loading</strong>
      </div>
      <div id="score-followthrough" class="overall-score" aria-live="polite">
        <span>follow-through</span>
        <strong>loading</strong>
      </div>
      <div id="score-insight" class="overall-score life-overall" aria-live="polite">
        <span>insight</span>
        <strong>loading</strong>
      </div>
    </section>
    <section class="local-intake" aria-label="upload bank">
      <div class="intake-copy">
        <h2>add to bank</h2>
      </div>
      <div class="intake-workspace">
        <div class="intake-input-column">
          <div class="dropzone" data-role="dropzone">
            <textarea id="brain-note" rows="4" placeholder="Paste text to convert into a PDF"></textarea>
            <div class="intake-controls">
              <label class="file-inline">
                <span>files / images</span>
                <input id="brain-files" type="file" multiple>
              </label>
              <button id="brain-save" type="button">save to vault</button>
            </div>
            <div id="brain-pending" class="pending-list" aria-live="polite"></div>
          </div>
          <aside id="score-summary" class="bank-summary" aria-live="polite">
            <p>Your note scores will appear here.</p>
          </aside>
        </div>
        <section id="brain-progress-history" class="score-history score-history-panel" aria-live="polite"></section>
      </div>
      
      <p id="brain-sync-status" class="sync-status">checking sync</p>
    </section>

    <section class="document-bank" aria-label="document bank">
      <div class="vault-toolbar" aria-live="polite">
        <input id="brain-search" type="search" aria-label="Search notes" placeholder="Search notes">
        <button id="brain-export-start" type="button">export notes</button>
        <div id="brain-export-actions" class="export-actions" hidden>
          <button id="brain-export-all" type="button">select all</button>
          <button id="brain-export-download" type="button">download selected</button>
          <button id="brain-export-cancel" type="button">cancel</button>
          <span id="brain-export-count">0 selected</span>
        </div>
      </div>
      <span id="brain-note-count" class="life-muted"></span>
      <div id="brain-vault" class="vault-list" aria-live="polite"></div>
      <div class="source-documents" aria-label="reference documents">
        <article class="source-document">
          <a class="vault-thumb" href="./ph-eval-Ala_Pha-by-Kristine_Zytka__PhD__EdS-20May-000948%20%281%29.pdf" aria-label="Open autism diagnostic evaluation PDF">
            <img src="./autism-evaluation-page-1.png" alt="">
          </a>
          <span class="vault-main">
            <span class="vault-title">autism evaluation</span>
            <span class="vault-meta">pdf</span>
          </span>
          <span class="vault-actions">
            <a class="source-action" href="./ph-eval-Ala_Pha-by-Kristine_Zytka__PhD__EdS-20May-000948%20%281%29.pdf">open</a>
            <a class="source-action" href="./ph-eval-Ala_Pha-by-Kristine_Zytka__PhD__EdS-20May-000948%20%281%29.pdf" download>download</a>
          </span>
        </article>
        <article class="source-document">
          <a class="vault-thumb" href="./ADHDLetter.pdf" aria-label="Open ADHD letter PDF">
            <img src="./adhd-letter-page-1.png" alt="">
          </a>
          <span class="vault-main">
            <span class="vault-title">adhd letter</span>
            <span class="vault-meta">1 page</span>
          </span>
          <span class="vault-actions">
            <a class="source-action" href="./ADHDLetter.pdf">open</a>
            <a class="source-action" href="./ADHDLetter.pdf" download>download</a>
          </span>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
