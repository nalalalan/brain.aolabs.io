<body>
  <header class="suite-topbar" aria-label="brain navigation">
    <div class="suite-brand-cluster">
      <a class="suite-ao-home" href="https://aolabs.io/" aria-label="aolabs.io">
        <img src="https://aolabs.io/marks/ao-ink.svg?v=20260516-suite-bloom" alt="">
      </a>
      <a class="suite-app-brand" href="./" aria-label="brain home">
        <img class="suite-app-mark" src="./favicon.svg?v=20260612-hub-mark" alt="">
        <span class="suite-app-name">brain.aolabs.io</span>
      </a>
    </div>
  </header>

  <main class="shell document-shell">
    <section id="life-progress" aria-label="Life progress"><h1>Life progress</h1><p>Loading your history…</p></section><p id="life-message" role="status" aria-live="polite"></p><dialog id="life-editor" aria-label="Progress editor"></dialog>
    <section class="local-intake" aria-label="upload bank">
      <div class="intake-copy">
        <h2>Save a note or file</h2>
      </div>
      <div class="intake-workspace">
        <div class="intake-input-column">
          <div class="dropzone" data-role="dropzone">
            <textarea id="brain-note" rows="4" placeholder="What do you want to keep? Paste or write a note."></textarea>
            <div class="intake-controls">
              <label class="file-inline">
                <span>files / images</span>
                <input id="brain-files" type="file" multiple>
              </label>
              <button id="brain-save" type="button">Save note</button>
            </div>
            <div id="brain-pending" class="pending-list" aria-live="polite"></div>
          </div>
          
        </div>
        
      </div>
      <p id="brain-sync-status" class="sync-status">checking sync</p>
    </section>

    <section class="document-bank" aria-label="document bank">
      <h2>Saved notes &amp; files</h2><label class="note-search">Search notes<input id="brain-search" type="search" placeholder="Find a note"></label><p id="brain-note-count" class="life-muted"></p>
      <div class="vault-toolbar" aria-live="polite">
        <button id="brain-export-start" type="button">export notes</button>
        <div id="brain-export-actions" class="export-actions" hidden>
          <button id="brain-export-all" type="button">select all</button>
          <button id="brain-export-download" type="button">download selected</button>
          <button id="brain-export-cancel" type="button">cancel</button>
          <span id="brain-export-count">0 selected</span>
        </div>
      </div>
      <div id="brain-vault" class="vault-list" aria-live="polite"></div>
      <details class="source-documents" aria-label="reference documents"><summary>Reference documents</summary>
        <article class="source-document">
          <a class="vault-thumb" href="./ph-eval-Ala_Pha-by-Kristine_Zytka__PhD__EdS-20May-000948%20%281%29.pdf" aria-label="Open autism diagnostic evaluation PDF">
            <img src="./autism-evaluation-page-1.png" alt="">
          </a>
          <span class="vault-main">
            <span class="vault-title">autism evaluation</span>
            <span class="vault-meta">pdf</span>
          </span>
          <span class="vault-actions">
            <a class="source-action" href="./ph-eval-Ala_Pha-by-Kristine_Zytka__PhD__EdS-20May-000948%20%281%29.pdf">open</a>
            <a class="source-action" href="./ph-eval-Ala_Pha-by-Kristine_Zytka__PhD__EdS-20May-000948%20%281%29.pdf" download>download</a>
          </span>
        </article>
        <article class="source-document">
          <a class="vault-thumb" href="./ADHDLetter.pdf" aria-label="Open ADHD letter PDF">
            <img src="./adhd-letter-page-1.png" alt="">
          </a>
          <span class="vault-main">
            <span class="vault-title">adhd letter</span>
            <span class="vault-meta">1 page</span>
          </span>
          <span class="vault-actions">
            <a class="source-action" href="./ADHDLetter.pdf">open</a>
            <a class="source-action" href="./ADHDLetter.pdf" download>download</a>
          </span>
        </article>
      </details>
    </section>
  </main>
</body>
</html>
